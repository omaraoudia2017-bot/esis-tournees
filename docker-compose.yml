services:
  db:
    image: postgres:16-alpine
    container_name: esis_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Europe/Paris
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Exposé uniquement sur la machine locale (pas sur le réseau)
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: esis_api
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      TZ: Europe/Paris
      WATCHFILES_FORCE_POLLING: "true"   # rechargement à chaud fiable sous Windows
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app          # code monté : modifications prises en compte sans rebuild
      - ./data:/data:ro                 # échantillons CSV en lecture seule
    ports:
      - "127.0.0.1:8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
